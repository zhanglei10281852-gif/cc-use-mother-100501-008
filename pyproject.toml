[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-handover"
version = "0.2.0"
description = "基础设施运营责任交接服务"
requires-python = ">=3.11"

[project.scripts]
asset-handover = "asset_handover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
